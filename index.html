<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♻️ Sort the Waste - Educational Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #fbe9f9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: #1f2937;
            margin-bottom: 20px;
            animation: slideDown 0.6s ease-out;
        }

        .header h1 {
            font-size: 2.4em;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #0f172a;
        }

        .header p {
            font-size: 1.05em;
            color: #334155;
            opacity: 0.95;
        }

        .progress-section {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 18px;
            box-shadow: 0 8px 16px rgba(2,6,23,0.08);
            animation: slideUp 0.6s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .progress-text {
            font-size: 0.98em;
            color: #374151;
            font-weight: 600;
        }

        .score-display {
            background: linear-gradient(90deg,#34d399,#10b981);
            color: white;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95em;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #f1f5f9;
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 1px 2px rgba(2,6,23,0.04);
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
            transition: width 0.3s ease;
        }

        /* Items pool as responsive card grid */
        .items-pool {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 22px;
            animation: slideUp 0.6s ease-out 0.1s backwards;
            align-items: start;
        }

        /* Waste card design */
        .waste-item {
            width: 100%;
            aspect-ratio: 1 / 1; /* keep cards square */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 16px;
            cursor: grab;
            transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
            user-select: none;
            text-align: center;
            color: #0f172a;
            box-shadow: 0 6px 18px rgba(2,6,23,0.06);
            border: 1px solid rgba(15,23,42,0.04);
            overflow: hidden;
        }

        .waste-item .emoji {
            font-size: 3.2rem;
            line-height: 1;
            margin-bottom: 8px;
        }

        .waste-item .label {
            font-size: 0.98rem;
            font-weight: 700;
            color: rgba(15,23,42,0.9);
        }

        .waste-item:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 18px 40px rgba(2,6,23,0.12);
        }

        .waste-item.dragging {
            opacity: 0.6;
            cursor: grabbing;
            transform: scale(0.98);
            box-shadow: 0 6px 16px rgba(2,6,23,0.08);
        }

        .waste-item.placed {
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            border-color: rgba(76,175,80,0.6);
            color: #14532d;
            pointer-events: none;
        }

        .waste-item.placed.incorrect {
            background: linear-gradient(135deg, #ffcdd2 0%, #ef9a9a 100%);
            border-color: rgba(244,63,94,0.7);
            color: #7f1d1d;
            animation: shake 0.5s ease-in-out;
        }

        /* Bins stay at bottom, horizontal layout on desktop, stack on mobile */
        .game-board {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out 0.2s backwards;
        }

        .category {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(2,6,23,0.06);
            min-height: 160px;
            display: flex;
            flex-direction: column;
            transition: all 0.25s ease;
        }

        .category.biodegradable {
            border: 3px solid rgba(16,185,129,0.12);
            background: linear-gradient(180deg, rgba(16,185,129,0.03), rgba(34,197,94,0.02));
        }

        .category.non-biodegradable {
            border: 3px solid rgba(249,115,22,0.09);
            background: linear-gradient(180deg, rgba(249,115,22,0.02), rgba(249,115,22,0.01));
        }

        .category.drag-over {
            transform: scale(1.02);
            box-shadow: 0 20px 48px rgba(16,185,129,0.12);
        }

        .category-title {
            font-size: 1.1em;
            font-weight: 800;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
        }

        .items-container {
            flex: 1;
            display: flex;
            flex-direction: row;
            gap: 10px;
            min-height: 80px;
            padding: 10px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.5));
            border: 2px dashed rgba(15,23,42,0.06);
            flex-wrap: wrap;
            align-content: flex-start;
        }

        .items-container .waste-item {
            /* Make placed items smaller inside bins */
            width: 90px;
            aspect-ratio: 1/1;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .feedback {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 12px;
            border-radius: 12px;
            animation: fadeIn 0.25s ease;
        }

        .feedback.correct {
            background: linear-gradient(90deg,#34d399,#10b981);
            color: white;
            box-shadow: 0 8px 24px rgba(16,185,129,0.12);
        }

        .feedback.incorrect {
            background: linear-gradient(90deg,#fb7185,#f97316);
            color: white;
            box-shadow: 0 8px 24px rgba(249,115,22,0.12);
        }

        .buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        button {
            background: linear-gradient(90deg,#6366f1,#7c3aed);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 0.95em;
            font-weight: 800;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 150ms ease, box-shadow 150ms ease;
            box-shadow: 0 8px 24px rgba(99,102,241,0.12);
        }

        button:hover { transform: translateY(-4px); }

        .reset-btn { background: linear-gradient(90deg,#f97316,#fb7185); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2,6,23,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            box-shadow: 0 30px 80px rgba(2,6,23,0.18);
            animation: scaleUp 0.5s ease-out;
            max-width: 520px;
            width: 92%;
        }

        .modal-content h2 { font-size: 1.8em; color: #111827; margin-bottom: 8px; }

        .modal-content .emoji-large { font-size: 3.4em; margin: 12px 0; }

        .score-result { font-size: 1.6em; font-weight: 800; margin: 10px 0; }

        .confetti { position: fixed; width: 16px; height: 16px; background: #FFD700; pointer-events: none; animation: confettiFall 3s ease-out forwards; }
        .confetti.emoji { width: auto; height: auto; font-size: 1.4rem; background: transparent; }

        .sound-toggle { position: fixed; top: 18px; right: 18px; background: white; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 1.2em; cursor: pointer; box-shadow: 0 8px 24px rgba(2,6,23,0.08); z-index: 100; }
        .sound-toggle.disabled { opacity: 0.6; }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        @keyframes shake { 0%,100%{ transform: translateX(0);}25%{ transform: translateX(-8px);}75%{ transform: translateX(8px);} }
        @keyframes confettiFall { 0%{ transform: translateY(-10vh) rotate(0deg); opacity: 1;} to{ transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        @media (max-width: 1024px) {
            .items-pool { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 1.9em; }
            .game-board { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 480px) {
            .items-pool { grid-template-columns: repeat(1, 1fr); }
            .header h1 { font-size: 1.4em; }
            .game-board { grid-template-columns: 1fr; gap: 12px; }
            .items-container .waste-item { width: 72px; aspect-ratio: 1/1; }
        }

    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>

    <div class="container">
        <div class="header">
            <h1>♻️ Sort the Waste 🌍</h1>
            <p>Help save the planet by sorting waste correctly — drag the cards into the correct bin below!</p>
        </div>

        <div class="progress-section">
            <div class="progress-text">📊 Progress: <span id="itemsSorted">0</span>/<span id="totalItems">8</span></div>
            <div style="flex:1 1 100%; margin-left:12px;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
            </div>
            <div class="score-display">⭐ Score: <span id="score">0</span>%</div>
        </div>

        <div class="feedback" id="feedback" style="display: none;"></div>

        <div class="items-pool" id="itemsPool"></div>

        <!-- Bins kept at the bottom -->
        <div class="game-board">
            <div class="category biodegradable" id="biodegradable" ondrop="drop(event)" ondragover="dragover(event)" ondragleave="dragleave(event)">
                <div class="category-title">
                    <span class="category-icon">🌱</span>
                    Biodegradable
                </div>
                <div class="items-container" id="biodegradableItems"></div>
            </div>

            <div class="category non-biodegradable" id="non-biodegradable" ondrop="drop(event)" ondragover="dragover(event)" ondragleave="dragleave(event)">
                <div class="category-title">
                    <span class="category-icon">♻️</span>
                    Non-Biodegradable
                </div>
                <div class="items-container" id="non-biodegradableItems"></div>
            </div>
        </div>

        <div class="buttons-container">
            <button id="resetBtn" class="reset-btn" onclick="resetGame()">🔄 Play Again</button>
        </div>
    </div>

    <div class="modal" id="celebrationModal">
        <div class="modal-content">
            <h2>🎉 Excellent! 🎉</h2>
            <div class="emoji-large">✨🌍♻️</div>
            <p>You sorted all the waste correctly!</p>
            <p>Great job protecting our planet!</p>
            <div class="score-result">
                Final Score: <span id="finalScore">100</span>%
            </div>
            <button onclick="resetGame()">🎮 Play Again</button>
        </div>
    </div>

    <script>
        // Sound management
        let soundEnabled = true;

        // Web Audio API for sound effects
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        // Create correct answer sound (ascending beep)
        function playCorrectSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        // Create incorrect answer sound (descending beep)
        function playIncorrectSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        // Celebrate sound
        function playCelebrationSound() {
            if (!soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const frequencies = [523.25, 659.25, 783.99]; // C5, E5, G5
            frequencies.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.02);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now + index * 0.02);
                osc.stop(now + 0.6 + index * 0.02);
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            btn.textContent = soundEnabled ? '🔊' : '🔇';
            btn.classList.toggle('disabled');
        }

        const gameData = {
            biodegradable: [
                { emoji: '🍌', name: 'Banana Peel' },
                { emoji: '🍃', name: 'Leaves' },
                { emoji: '🍎', name: 'Apple Core' },
                { emoji: '📄', name: 'Paper' }
            ],
            nonBiodegradable: [
                { emoji: '🥤', name: 'Plastic Cup' },
                { emoji: '🧴', name: 'Plastic Bottle' },
                { emoji: '🥫', name: 'Can' },
                { emoji: '🔋', name: 'Battery' }
            ]
        };

        let gameState = {
            itemsSorted: 0,
            correctSorts: 0,
            totalItems: 8,
            sorted: {},
            draggedItem: null
        };

        function initGame() {
            gameState = {
                itemsSorted: 0,
                correctSorts: 0,
                totalItems: 8,
                sorted: {},
                draggedItem: null
            };

            const itemsPool = document.getElementById('itemsPool');
            itemsPool.innerHTML = '';

            // Shuffle items
            const allItems = [
                ...gameData.biodegradable.map(item => ({ ...item, category: 'biodegradable' })),
                ...gameData.nonBiodegradable.map(item => ({ ...item, category: 'non-biodegradable' }))
            ];

            allItems.sort(() => Math.random() - 0.5);

            const palette = [
                'linear-gradient(135deg,#ffe7d6,#ffd6a5)',
                'linear-gradient(135deg,#e6f8ff,#c7f3ff)',
                'linear-gradient(135deg,#fef6e7,#fff1a8)',
                'linear-gradient(135deg,#eafde7,#d1ffd9)',
                'linear-gradient(135deg,#f4e8ff,#e9d5ff)',
                'linear-gradient(135deg,#ffeef8,#ffd6f0)'
            ];

            allItems.forEach((item, index) => {
                const itemEl = document.createElement('div');
                itemEl.className = 'waste-item';
                itemEl.id = `item-${index}`;
                itemEl.draggable = true;
                // card content with large emoji and label
                itemEl.innerHTML = `<div class="emoji">${item.emoji}</div><div class="label">${item.name}</div>`;
                itemEl.dataset.category = item.category;

                // give each card a colorful background from palette
                itemEl.style.background = palette[index % palette.length];

                itemEl.addEventListener('dragstart', dragstart);
                itemEl.addEventListener('dragend', dragend);

                itemsPool.appendChild(itemEl);
                gameState.sorted[`item-${index}`] = false;
            });

            updateProgress();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('celebrationModal').classList.remove('show');
            document.getElementById('biodegradableItems').innerHTML = '';
            document.getElementById('non-biodegradableItems').innerHTML = '';
        }

        function dragstart(e) {
            gameState.draggedItem = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function dragend(e) {
            if (e.target) e.target.classList.remove('dragging');
        }

        function dragover(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('drag-over');
        }

        function dragleave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            if (!gameState.draggedItem) return;

            const targetCategory = e.currentTarget.id;
            const itemCategory = gameState.draggedItem.dataset.category;
            const itemId = gameState.draggedItem.id;

            if (gameState.sorted[itemId]) {
                showFeedback('Already sorted! 🎯', false);
                playIncorrectSound();
                return;
            }

            let isCorrect = false;

            if (targetCategory === 'biodegradable' && itemCategory === 'biodegradable') {
                isCorrect = true;
            } else if (targetCategory === 'non-biodegradable' && itemCategory === 'non-biodegradable') {
                isCorrect = true;
            }

            if (isCorrect) {
                gameState.draggedItem.classList.add('placed', 'item-correct');
                gameState.correctSorts++;
                showFeedback('✅ Correct! Great job!', true);
                playCorrectSound();
                createSmallConfetti();

                const container = document.getElementById(targetCategory + 'Items');
                gameState.draggedItem.draggable = false;
                container.appendChild(gameState.draggedItem);
                gameState.draggedItem.style.cursor = 'default';
            } else {
                gameState.draggedItem.classList.add('placed', 'incorrect');
                showFeedback('❌ Try Again! Wrong category.', false);
                playIncorrectSound();

                setTimeout(() => {
                    if (gameState.draggedItem) gameState.draggedItem.classList.remove('placed', 'incorrect');
                }, 500);
            }

            gameState.sorted[itemId] = isCorrect;
            gameState.itemsSorted++;

            updateProgress();

            if (gameState.itemsSorted === gameState.totalItems) {
                setTimeout(showCelebration, 1000);
            }

            gameState.draggedItem = null;
        }

        function showFeedback(message, isCorrect) {
            const feedbackEl = document.getElementById('feedback');
            feedbackEl.textContent = message;
            feedbackEl.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
            feedbackEl.style.display = 'flex';

            setTimeout(() => {
                feedbackEl.style.display = 'none';
            }, 1800);
        }

        function updateProgress() {
            const percentage = Math.round((gameState.correctSorts / gameState.totalItems) * 100);
            document.getElementById('itemsSorted').textContent = gameState.correctSorts;
            document.getElementById('score').textContent = percentage;
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        function showCelebration() {
            playCelebrationSound();
            createConfetti();
            document.getElementById('finalScore').textContent = Math.round((gameState.correctSorts / gameState.totalItems) * 100);
            document.getElementById('celebrationModal').classList.add('show');
        }

        // Small confetti for correct answers
        function createSmallConfetti() {
            for (let i = 0; i < 12; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * 30 + '%';
                confetti.style.backgroundColor = ['#FFD700', '#FF6B6B', '#4CAF50', '#667eea', '#f093fb'][Math.floor(Math.random() * 5)];
                confetti.style.animationDelay = Math.random() * 0.3 + 's';
                confetti.style.width = (Math.random() * 10 + 6) + 'px';
                confetti.style.height = confetti.style.width;
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 2200);
            }
        }

        // Large confetti for game completion
        function createConfetti() {
            const emojis = ['🎉', '✨', '🌟', '⭐', '🎊', '🌍', '♻️', '🌱'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = ['#FFD700', '#FF6B6B', '#4CAF50', '#667eea', '#f093fb', '#FF8A80', '#81C784'][Math.floor(Math.random() * 7)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.width = (Math.random() * 15 + 8) + 'px';
                confetti.style.height = confetti.style.width;
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3500);
            }

            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti emoji';
                confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 3500);
            }
        }

        function resetGame() {
            document.getElementById('celebrationModal').classList.remove('show');
            initGame();
        }

        // Initialize game on page load
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
